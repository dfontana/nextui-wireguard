name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq zip curl

      - name: Validate pak.json
        run: |
          jq . pak.json
          for field in name version type description author repo_url release_filename platforms; do
            val=$(jq -r ".$field" pak.json)
            if [ "$val" = "null" ]; then
              echo "ERROR: Missing required field in pak.json: $field"
              exit 1
            fi
          done
          echo "pak.json is valid"

      - name: Check shell script syntax
        run: |
          sh -n launch.sh
          sh -n bin/on-boot
          echo "Shell scripts are syntactically valid"

      - name: Set up Go (for wireguard-go)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build wireguard-go (arm64)
        run: |
          git clone --depth=1 https://github.com/WireGuard/wireguard-go /tmp/wireguard-go
          cd /tmp/wireguard-go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/wg-go-arm64 .
          mkdir -p $GITHUB_WORKSPACE/bin/arm64
          cp /tmp/wg-go-arm64 $GITHUB_WORKSPACE/bin/arm64/wireguard-go
          chmod +x $GITHUB_WORKSPACE/bin/arm64/wireguard-go
          cp /tmp/wireguard-go/LICENSE $GITHUB_WORKSPACE/bin/arm64/wireguard-go.LICENSE

      - name: Set up QEMU (arm64 Docker builds for wg)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        run: make build

      - name: Release
        run: make release

      - name: Verify zip structure
        run: |
          echo "--- Zip contents ---"
          unzip -l "dist/$(jq -r .release_filename pak.json)"
          echo "--- Checking required files ---"
          unzip -l "dist/$(jq -r .release_filename pak.json)" | grep -E "launch\.sh|pak\.json|bin/"
          echo "Zip structure OK"
